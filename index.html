     domain as served — it does not run the page or follow the redirect. -->

<title>Vivien Chin — Senior Product Designer, London</title>
<meta name="description" content="Portfolio of Vivien Chin, Senior Product Designer in London — fintech, enterprise systems and AI-driven design.">
<link rel="canonical" href="https://aibotvivi.github.io/portfolio/">
<link rel="icon" href="portfolio/assets/img/favicon.png">
<meta name="color-scheme" content="light dark">
<!-- Only for browsers running no JavaScript. Left outside <noscript> it raced the
     tag, and a visit reported by nobody is exactly what "tag not detected" means. -->
<noscript><meta http-equiv="refresh" content="0; url=portfolio/"></noscript>
<style>
  :root { color-scheme: light dark; --page: #F5F3ED; --ink: #1F1F1F; --body: #5A5A5A; --desk: #2839c2; }
  @media (prefers-color-scheme: dark) { :root { --page: #1A1A1A; --ink: #F4F4F4; --body: #B4B0A6; } }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--desk); color: var(--ink);
    font: 400 15px/1.5 ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, "Courier New", monospace;
  }
  .card {
    max-width: 380px; width: 100%; padding: 26px 24px; text-align: center;
    background: var(--page); border: 2px solid var(--ink); box-shadow: 8px 8px 0 rgba(31,31,31,.92);
  }
  h1 { margin: 0 0 6px; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; }
  p { margin: 0 0 18px; color: var(--body); font-size: 13px; }
  a {
    display: inline-block; padding: 10px 18px; background: var(--ink); color: var(--page);
    text-decoration: none; border: 2px solid var(--ink); font-size: 13px; letter-spacing: .06em;
  }
  a:hover, a:focus-visible { background: var(--page); color: var(--ink); }
</style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5FTTLHDT"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<main class="card">
  <h1>Vivien Chin</h1>
  <p>Taking you to the portfolio&hellip;</p>
  <a href="portfolio/">Open the portfolio &rarr;</a>
</main>
<script>
  /* Leave only once the tag has loaded and had a moment to report the visit.
     A fixed short delay did not do it: gtag.js is fetched asynchronously, so a
     redirect on a timer can beat it away and the visit is never reported at
     all — which is what an installation check reads as "tag not detected".
     replace(), not assign(): Back must not bounce the visitor straight back
     here. The 3s cap covers a tag that is blocked and never loads. */
  (function () {
    var left = false, started = Date.now();
    function leave() { if (left) { return; } left = true; location.replace('portfolio/'); }
    (function wait() {
      var waited = Date.now() - started;
      if ((window.tagLoaded && waited > 1200) || waited > 3000) { leave(); return; }
      setTimeout(wait, 100);
    }());
  }());
</script>
</body>
</html>
